<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tienda de ejemplo con carrito de compra.">
    <title>Tienda | Lenguaje de Marcas</title>
    <link rel="stylesheet" href="../assets/css/estilo.css">
    <script src="../JS/tema.js" defer></script>
    <script src="../JS/Mi_tienda.js" defer></script>
</head>
<body>
    <header>
        <h1>Tienda de informática</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="horario.html">Horario</a>
            <a href="formulario.html">Formulario</a>
            <a href="cuaderno.html">Cuaderno</a>
            <a href="Mi_tienda.html" aria-current="page">Tienda</a>
            <a href="calculadora.html">Calculadora</a>
            <a href="piedrapapeltijera.html">Piedra, papel o tijera</a>
            <a href="estilosjavascrip.html">Modo</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="tienda-presentacion">
            <h2>Accesorios para tu equipo</h2>
            <p>Explora los productos y prueba el carrito de compra.</p>
        </section>

        <section id="lista-productos" class="tienda-productos" aria-label="Productos"></section>

        <section class="tienda-carrito" aria-labelledby="titulo-carrito">
            <h2 id="titulo-carrito">Tu carrito (<span id="contador-carrito">0</span>)</h2>
            <ul id="lista-carrito" class="tienda-lista-carrito" aria-live="polite"></ul>
            <p class="tienda-total">Total: <strong id="total-carrito">0,00 €</strong></p>
            <p id="mensaje-tienda" class="tienda-mensaje" aria-live="polite"></p>
            <button id="boton-comprar" type="button" disabled>Finalizar compra</button>
        </section>
    </main>

    <footer>
        <p>Creado por Alberto</p>
    </footer>
</body>
</html>
